<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Registrazione</title>
</head>
<body>
	<form action="../ServletRegistrazioneCookie" method="get">
		<label for="username">Username: </label>
		<input type="text" id="username" name="usernameInput" required>
		
		<label for="password">Password: </label>
		<input type="text" id="password" name="password" required>
		
		<label for="favoriteColor">Colore preferito: </label>
		<input type="text" id="colorInput" name="colorInput" required>
		
		<button type="submit">Accedi</button>
	</form>
</body>
</html>
