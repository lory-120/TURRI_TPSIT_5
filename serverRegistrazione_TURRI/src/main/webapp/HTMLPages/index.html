<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Registrazione</title>
</head>
<body>
	<form action="../ServletRegistrazione" method="get">
		<label for="name">Nome: </label>
		<input type="text" id="name" name="nameInput" required>
		<label for="email">Email: </label>
		<input type="email" id="email" name="emailInput" required>
		<label for="età">Età: </label>
		<input type="number" id="età" name="etaInput" required>
		<button type="submit">Registrati</button>
	</form>
</body>
</html>
