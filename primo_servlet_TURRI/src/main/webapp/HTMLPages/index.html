<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Saluto con Servlet</title>
</head>
<body>
	<!--il metodo HTTP GET rappresenta una richiesta con un parametro, inviata al server (dati piccoli, non privati)-->
	<form action="../ServerSaluto" method="get">
		<label for="nome">Inserisci il tuo nome: </label>
		<input type="text" id="nome" name="nomeImmesso" required></input>
		<button type="submit">Invia</button>
	</form>
</body>
</html>
